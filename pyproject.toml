[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratalens"
version = "0.1.0"
description = "Audit aggregate versus pooled-stratum standardized binary comparisons."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ikteder Akhand Udoy"}]
classifiers = [
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
stratalens = "stratalens.cli:main"

[tool.setuptools.packages.find]
include = ["stratalens*"]
